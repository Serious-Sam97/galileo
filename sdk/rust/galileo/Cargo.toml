[package]
name = "galileo"
version = "0.1.0"
edition = "2021"
description = "Galileo observability for Rust services: tracing layer + OTLP exporter, identity on every span, call sites, axum middleware, sqlx query spans, error capture."
license = "MIT"

[dependencies]
opentelemetry = "0.32"
opentelemetry_sdk = { version = "0.32", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.32", features = ["http-proto", "reqwest-blocking-client", "trace", "logs"] }
opentelemetry-appender-tracing = "0.32"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "registry"] }
tracing-opentelemetry = "0.33"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
axum = { version = "0.8", optional = true }
http = "1"
tower = { version = "0.5", optional = true }
regex = "1"
once_cell = "1"

[features]
default = ["axum"]
axum = ["dep:axum", "dep:tower"]

[dev-dependencies]
axum = "0.8"
serde_json = "1"
tokio = { version = "1", features = ["full"] }
