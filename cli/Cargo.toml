[package]
name = "galileo-cli"
version = "0.1.0"
edition = "2021"
description = "galileo — command line for Galileo: query, tail logs, deploy markers, export/import config"

[[bin]]
name = "galileo"
path = "src/main.rs"

[dependencies]
clap.workspace = true
reqwest = { workspace = true, features = ["blocking"] }
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
toml.workspace = true
dirs.workspace = true
anyhow.workspace = true
